# Include inside the aaPanel HTTPS VirtualHost; retain aaPanel certificate directives.
# Set DocumentRoot to /www/wwwroot/big-mobile/current/frontend/build.
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders Off
RequestHeader unset X-Forwarded-For
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-Proto "https"
ProxyPass /api/ http://127.0.0.1:8000/api/ connectiontimeout=5 timeout=130
ProxyPassReverse /api/ http://127.0.0.1:8000/api/
LimitRequestBody 47185920
<Directory "/www/wwwroot/big-mobile/current/frontend/build">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [END]
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(self), geolocation=(self), microphone=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
<Files "index.html">
    Header set Cache-Control "no-cache"
</Files>
