name: Verify application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-test.txt -r deploy/requirements-ops.txt pip-audit
      - run: python -m pytest backend/tests/test_local_regressions.py backend/tests/test_workflow_audit.py backend/tests/test_production_security.py backend/tests/test_backup_ops.py backend/tests/test_chat.py -q
      - run: pip-audit -r backend/requirements-production.lock --disable-pip
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ''
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Native MySQL transaction tests
        run: |
          sudo systemctl start mysql
          sudo mysql -e "SET GLOBAL log_bin_trust_function_creators=1; CREATE USER 'bigmobile'@'localhost' IDENTIFIED BY 'qa-local-ci-password'; CREATE DATABASE big_mobile_test; GRANT ALL ON big_mobile_test.* TO 'bigmobile'@'localhost';"
          sudo mysql -e 'GRANT ALL ON `audit_mysql_%`.* TO "bigmobile"@"localhost";'
          python -m pytest backend/tests/test_real_transactions.py backend/tests/test_mysql_ops.py -q
        env:
          MYSQL_TEST_URL: mysql://bigmobile:qa-local-ci-password@127.0.0.1:3306/big_mobile_test
          RUN_BROWSER_TESTS: 'true'
      - name: Native Apache configuration
        run: |
          bash -n deploy/release.sh deploy/rollback.sh
          sudo apt-get update
          sudo apt-get install -y apache2
          sudo a2enmod proxy proxy_http headers rewrite
          sudo mkdir -p /www/wwwroot/big-mobile/current/frontend/build
          sudo cp deploy/aapanel-apache.conf /etc/apache2/conf-available/big-mobile.conf
          sudo a2enconf big-mobile
          sudo apache2ctl -t
