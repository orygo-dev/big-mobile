name: Verify application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-test.txt -r deploy/requirements-ops.txt pip-audit
      - run: python -m pytest backend/tests/test_local_regressions.py backend/tests/test_workflow_audit.py backend/tests/test_production_security.py backend/tests/test_backup_ops.py -q
      - run: pip-audit -r backend/requirements-production.lock --disable-pip
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ''
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          docker run -d --name mongo-qa -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo-qa mongosh --quiet --eval 'db.adminCommand({ping:1})' && break; sleep 2; done
          docker exec mongo-qa mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo-qa mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' && break; sleep 2; done
          python -m pytest backend/tests/test_real_transactions.py -q
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          RUN_BROWSER_TESTS: 'true'
      - run: |
          cp deploy/app.env.example deploy/app.env
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.yml build
          docker run --rm --add-host backend:127.0.0.1 --entrypoint nginx "big-mobile-web:$RELEASE_TAG" -t
        env:
          RELEASE_TAG: ci-${{ github.sha }}
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: big-mobile-api:ci-${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: big-mobile-web:ci-${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
